  --accent:#1f3358; --accent-fg:#ffffff; --accent-soft:#d6eaf8;
  --team-a:#5aa9dc; --team-b:#1f3358; --team-c:#c9822b;
  --pitch:#2a4a7a; --pitch-2:#264470; --chalk:rgba(255,255,255,.8);
  --ok:#2c8a4b; --warn:#b7791f; --bad:#c0392b;
  --shadow:0 1px 2px rgba(20,34,61,.08),0 4px 14px rgba(20,34,61,.07);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1526; --surface:#15213a; --surface-2:#1c2a47; --line:#2a3a5c; --fg:#e8f0fa; --muted:#9fb2cc;
  --accent:#8ec4e8; --accent-fg:#0e1a30; --accent-soft:#1f3556;
  --team-a:#8ec4e8; --team-b:#5f8fd0; --team-c:#e39a55;
  --pitch:#1d355c; --pitch-2:#1a3155; --chalk:rgba(255,255,255,.65);
  --ok:#55c07a; --warn:#e0a84a; --bad:#e2685a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1526; --surface:#15213a; --surface-2:#1c2a47; --line:#2a3a5c; --fg:#e8f0fa; --muted:#9fb2cc;
  --accent:#8ec4e8; --accent-fg:#0e1a30; --accent-soft:#1f3556;
  --team-a:#8ec4e8; --team-b:#5f8fd0; --team-c:#e39a55;
  --pitch:#1d355c; --pitch-2:#1a3155; --chalk:rgba(255,255,255,.65);
  --ok:#55c07a; --warn:#e0a84a; --bad:#e2685a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.1}

.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{flex:none}
.brand h1{font-size:24px;text-transform:uppercase;letter-spacing:.04em}
.brand small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);letter-spacing:0;text-transform:none;font-weight:500}
.nav{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:999px}
.nav button{border:0;background:transparent;padding:6px 16px;border-radius:999px;font-family:var(--f-display);font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.nav button[aria-current="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.sync.saving i{background:var(--warn)}
.sync.local i{background:var(--muted)}
/* En-tête aux couleurs du club */
body::before{background:var(--navy)}
header.top{background:var(--navy);border-bottom:3px solid var(--sky);color:#fff}
header.top .brand small{color:#c9dcf0}
header.top .brand img{box-shadow:0 0 0 2px var(--sky)}
header.top .nav{background:rgba(255,255,255,.1)}
header.top .nav button{color:#c9dcf0}
header.top .nav button[aria-current="true"]{background:var(--sky);color:var(--navy);box-shadow:none}
header.top .sync{color:#c9dcf0}
header.top .btn{background:transparent;color:#fff;border-color:rgba(142,196,232,.6)}
header.top .btn:hover{background:rgba(142,196,232,.15);border-color:var(--sky)}
.tabs button[aria-selected="true"]{border-bottom-color:var(--sky)}
.team-h h3::before,.cat label .ic{box-shadow:0 0 0 1px rgba(0,0,0,.05)}

main{padding-block:20px 60px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.iconbtn{border:0;background:transparent;width:30px;height:30px;border-radius:6px;display:inline-grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--surface-2);color:var(--fg)}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
label.fld input,label.fld select,label.fld textarea,.inp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:15px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--fg);width:100%}
textarea{resize:vertical;min-height:70px}
.eyebrow{font-family:var(--f-display);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
.empty h3{color:var(--fg);font-size:22px;margin-bottom:6px}
.tag{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.06em;padding:1px 6px;border-radius:4px;background:var(--surface-2);color:var(--muted);text-transform:uppercase}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-dispo{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.st-blesse{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.st-suspendu{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.st-absent{color:var(--muted);background:var(--surface-2)}

/* ---------- Players page ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:16px}
.toolbar h2{font-size:34px;text-transform:uppercase;margin-right:auto}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chipf{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chipf[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.pcard:hover{border-color:var(--muted)}
.pcard-top{display:flex;gap:12px;align-items:center}
.jersey{font-family:var(--f-display);font-weight:800;font-size:22px;width:44px;height:44px;border-radius:8px;display:grid;place-items:center;background:var(--fg);color:var(--bg);flex:none;font-variant-numeric:tabular-nums}
.pname{font-weight:700;font-size:16px;line-height:1.2;min-width:0}
.pname small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;align-items:center;font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:3px}
.bars b{font-variant-numeric:tabular-nums;color:var(--fg);font-weight:600}

/* ---------- Matches page ---------- */
.mlist{display:flex;flex-direction:column;gap:10px}
.mcard{display:grid;grid-template-columns:86px 1fr auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;text-align:left;width:100%}
.mcard:hover{border-color:var(--muted)}
.mdate{font-family:var(--f-display);text-align:center;line-height:1;border-right:1px solid var(--line);padding-right:14px}
.mdate b{display:block;font-size:34px;font-weight:800}
.mdate span{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.mtitle{font-family:var(--f-display);font-size:22px;font-weight:700;text-transform:uppercase;min-width:0}
.mmeta{font-size:13px;color:var(--muted)}
.score{font-family:var(--f-display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums;white-space:nowrap}
.score.tbd{font-size:14px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.res-w{color:var(--ok)}.res-l{color:var(--bad)}.res-d{color:var(--warn)}

/* ---------- Match sheet ---------- */
.sheet-head{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.sheet-head h2{font-size:32px;text-transform:uppercase}
.sheet-head .mmeta{font-size:14px}
.scorebox{display:flex;align-items:center;gap:8px;margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 12px}
.scorebox input{width:52px;text-align:center;font-family:var(--f-display);font-size:26px;font-weight:800;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:2px}
.scorebox span{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 18px;font-family:var(--f-display);font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tabs button .n{font-family:var(--f-body);font-size:12px;color:var(--muted);margin-left:4px;font-weight:600}

/* player chip (draggable) */
.chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 6px 5px 5px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:manipulation;min-width:0}
.chip:hover{border-color:var(--muted)}
.chip.sel{outline:2px solid var(--accent);outline-offset:1px;background:var(--accent-soft)}
.chip.dragging{opacity:.4}
.chip .num{font-family:var(--f-display);font-weight:800;font-size:15px;width:28px;height:28px;border-radius:6px;background:var(--fg);color:var(--bg);display:grid;place-items:center;flex:none;font-variant-numeric:tabular-nums}
.chip .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.chip .dot{width:8px;height:8px;border-radius:50%;flex:none}
.chip .avg{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dot.st-dispo{background:var(--ok)}.dot.st-blesse{background:var(--bad)}.dot.st-suspendu{background:var(--warn)}.dot.st-absent{background:var(--muted)}

.hint{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:15;background:var(--fg);color:var(--bg);border-radius:8px;padding:8px 12px;font-size:14px;display:flex;gap:10px;align-items:center;margin-bottom:12px}
.hint button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:6px;padding:2px 8px;font-size:13px}

.prep{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
.pool{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);padding:12px;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 90px);overflow:auto}
.pool .list{display:flex;flex-direction:column;gap:6px;min-height:60px}
.teams{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.team{border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.team-h{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.team-h h3{font-size:22px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.team-h h3::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--tc)}
.team-h .cnt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.team-h select{margin-left:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:3px 6px;font-size:13px;font-weight:600}
.team[data-t="A"]{--tc:var(--team-a)}.team[data-t="B"]{--tc:var(--team-b)}.team[data-t="C"]{--tc:var(--team-c)}
.team{border-top:4px solid var(--tc)}
.team-body{padding:10px;display:flex;flex-direction:column;gap:10px;min-height:180px;flex:1}
.grp .eyebrow{font-size:11px;margin-bottom:4px}
.grp .list{display:flex;flex-direction:column;gap:5px}
.dz{transition:background .12s}
.dz.over{background:var(--accent-soft)}
.dz.target{box-shadow:inset 0 0 0 2px var(--accent)}
.team .ph{color:var(--muted);font-size:13px;text-align:center;padding:20px 8px;border:1.5px dashed var(--line);border-radius:8px}

/* coaching */
.coach{display:grid;grid-template-columns:250px minmax(0,1fr) minmax(260px,330px);gap:16px;align-items:start}
.coach .pitch{max-width:600px;margin:0 auto}
.squad{padding:12px;display:flex;flex-direction:column;gap:8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow:auto}
.squad .list{display:flex;flex-direction:column;gap:5px;min-height:36px}
.squad .note{font-size:13px;color:var(--muted);margin:0}
.coach .slot .lbl{font-size:13px}
@media (max-width:1250px){.coach{grid-template-columns:240px minmax(0,1fr)}.coach .talk{grid-column:1/-1;position:static}}
.pitch-wrap{display:flex;flex-direction:column;gap:10px}
.pitch-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pitch{position:relative;aspect-ratio:68/80;max-width:100%;width:100%;border-radius:var(--r);overflow:hidden;
  background:repeating-linear-gradient(180deg,var(--pitch) 0 10%,var(--pitch-2) 10% 20%)}
.pitch svg.lines{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;width:21%;min-width:64px}
.slot .disc{width:46px;height:46px;border-radius:50%;border:2px dashed var(--chalk);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:#fff;font-size:13px;letter-spacing:.04em;background:rgba(0,0,0,.12)}
.slot.filled .disc{border:2px solid #fff;background:#fff;color:#16301f;font-size:19px;box-shadow:0 2px 6px rgba(0,0,0,.3);cursor:grab}
.slot .lbl{font-size:12px;font-weight:700;color:#fff;background:rgba(0,0,0,.35);padding:1px 6px;border-radius:4px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 1px rgba(0,0,0,.3)}
.slot .pos{font-size:10px;font-weight:700;color:rgba(255,255,255,.8);letter-spacing:.06em;font-family:var(--f-display)}
.slot.over .disc,.slot.target .disc{border-color:#ffd54a;box-shadow:0 0 0 3px rgba(255,213,74,.5)}
.slot.sel .disc{box-shadow:0 0 0 3px #ffd54a}
.bench{padding:12px}
.bench .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;min-height:44px}
.talk{padding:16px;display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
.talk h3{font-size:26px;text-transform:uppercase}
.talk ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:t}
.talk li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:start;padding:6px;border-radius:8px;background:var(--surface-2);counter-increment:t}
.talk li::before{content:counter(t);font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--accent);text-align:center;line-height:30px}
.talk li textarea{min-height:30px;border:0;background:transparent;padding:4px 2px;resize:none;overflow:hidden;width:100%;line-height:1.4}
.talk li.done textarea{text-decoration:line-through;color:var(--muted)}
.talk li .acts{display:flex;gap:0}
.talk .add{display:flex;gap:6px}
.talk .note{font-size:13px;color:var(--muted)}

/* summary */
.sum{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
.sum-sec{padding:16px;display:flex;flex-direction:column;gap:12px}
.sum-sec h3{font-size:24px;text-transform:uppercase}
.prow{display:grid;grid-template-columns:200px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.prow:first-of-type{border-top:0}
.prow .who{display:flex;flex-direction:column;gap:6px}
.prow .rate{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.prow .rate select{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:2px 4px;font-size:13px;font-variant-numeric:tabular-nums}
.prow textarea{min-height:56px}
.tsub{display:flex;gap:6px;flex-wrap:wrap}
.cat{display:flex;flex-direction:column;gap:6px}
.cat label{font-family:var(--f-display);font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.cat label .ic{width:22px;height:22px;border-radius:5px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px}
.cat.work label .ic{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}

/* absents, capitaine, étoiles, buts */
.prep-main{display:flex;flex-direction:column;gap:12px;min-width:0}
.absents .team-body{min-height:0}
.abs-list{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.capb{font-family:var(--f-display);font-weight:800;font-size:12px;line-height:18px;min-width:18px;text-align:center;border-radius:4px;background:#f2c230;color:#3a2a00;flex:none}
.stars{color:#d9a400;font-size:13px;letter-spacing:-1px;white-space:nowrap;flex:none}
.slot .roles{display:flex;gap:3px;align-items:center;background:rgba(0,0,0,.45);border-radius:4px;padding:0 4px}
.slot .stars{color:#ffd54a}
.roles-box{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.star-row{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:center}
.stars.big{font-size:18px;letter-spacing:1px}
.buts{display:flex;flex-direction:column;gap:8px}
.but-row{display:grid;grid-template-columns:28px 90px 1fr 1fr 30px;gap:10px;align-items:end;padding:8px;border-radius:8px;background:var(--surface-2)}
.but-n{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--accent);text-align:center;line-height:38px}
.gstat{font-size:12px;color:var(--fg);font-weight:600}
@media (max-width:700px){.but-row{grid-template-columns:28px 1fr 30px}.but-row label{grid-column:2}.but-row .iconbtn{grid-column:3;grid-row:1}}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,18,12,.5);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal-h h2{font-size:26px;text-transform:uppercase;margin-right:auto}
.modal-b{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.modal-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:90px 1fr 1fr;gap:12px}
.rates{display:grid;grid-template-columns:110px 1fr 30px;gap:8px 12px;align-items:center}
.rates span{font-weight:600;font-size:14px}
.rates output{font-family:var(--f-display);font-weight:800;font-size:18px;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{accent-color:var(--accent);width:100%}
.checks{display:flex;gap:6px;flex-wrap:wrap}
.checks label{display:flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:13px;font-weight:600;cursor:pointer}
.checks input{accent-color:var(--accent)}
.confirm{background:color-mix(in srgb,var(--bad) 10%,transparent);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent);border-radius:8px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:8px;font-weight:600;z-index:60;font-size:14px}

@media (max-width:1000px){
  .prep{grid-template-columns:1fr}
  .pool{position:static;max-height:none}
  .pool .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .teams{grid-template-columns:1fr}
  .coach,.sum{grid-template-columns:1fr}
  .talk,.squad{position:static;max-height:none}
}
@media (max-width:560px){
  .mcard{grid-template-columns:60px 1fr;gap:10px}
  .mcard .score{grid-column:2}
  .mdate b{font-size:26px}
  .prow{grid-template-columns:1fr}
  .g2,.g3{grid-template-columns:1fr}
  .scorebox{margin-left:0}
  .brand small{display:none}
  .slot .disc{width:36px;height:36px}
  .slot.filled .disc{font-size:16px}
  .slot{min-width:54px}
  .slot .lbl{font-size:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ================= Exports PDF ================= */
@media screen{#print-root{display:none}}
@media print{
  body{background:#fff!important;padding:0!important}
  body::before{display:none!important}
  body>*:not(#print-root){display:none!important}
  #print-root{display:block}
}
#print-root{color:#111;font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}

#print-root .pr-land{width:297mm;height:209mm}
#print-root .pr-port{width:210mm;height:296mm}

#print-root .pr-cond{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif}
#print-root h3{margin:0 0 6px;font-size:14px;text-transform:uppercase;letter-spacing:.08em}

/* en-tête noir et blanc (coaching) */

#print-root .pr-hd .pr-t{flex:1;min-width:0}

#print-root .pr-meta{text-align:right;font-size:12px;color:#555}
#print-root .pr-meta strong{display:block;color:#111;font-size:14px}
/* terrain */
#print-root .pr-pitch{position:relative;border:1.5px solid #333;border-radius:4px;background:#fff}

#print-root .pr-stars{letter-spacing:-1px;font-size:12px}

#print-root .pr-sub .pr-n{width:22px;height:22px;background:#fff;color:#111;border:1.5px solid #111;font-size:11px}
/* coaching */
#print-root .pr-cgrid{display:grid;grid-template-columns:58% 1fr;gap:10mm}
#print-root .pr-cgrid .pr-pitch{height:128mm}
#print-root .pr-talk ol{margin:0;padding:0;list-style:none;counter-reset:t;display:flex;flex-direction:column;gap:8px}

#print-root .pr-talk li::before{content:counter(t);font-weight:800;font-size:22px;line-height:1}

#print-root .pr-foot{position:absolute;left:12mm;right:12mm;bottom:7mm;display:flex;justify-content:space-between;font-size:10px;color:#555}
/* préparation */

      <button id="nav-players" data-nav="players">Effectif</button>
    </nav>
    <div class="row" style="gap:6px">
      <button class="btn sm" id="backup-export" title="Enregistrer toutes les données dans un fichier">Sauvegarder</button>
      <button class="btn sm" id="backup-import" title="Recharger un fichier de sauvegarde">Restaurer</button>
      <input type="file" id="backup-file" accept=".json,application/json" hidden>
    </div>
    <div class="sync" id="sync"><i></i><span>Connexion…</span></div>
  </div>
</header>
<main class="wrap" id="app"></main>
<div id="modal-root"></div>
<div id="toast-root"></div>
<div id="print-root"></div>
<style id="pr-page"></style>

<script>
(() => {
/* ================= Data ================= */
const POSTES = [
  {k:"GB",l:"Gardien"},{k:"DEF",l:"Défenseur"},{k:"MIL",l:"Milieu"},{k:"ATT",l:"Attaquant"}
];
const POSTE_LBL = Object.fromEntries(POSTES.map(p=>[p.k,p.l]));
const STATUTS = [{k:"dispo",l:"Disponible"},{k:"blesse",l:"Blessé"},{k:"suspendu",l:"Suspendu"},{k:"absent",l:"Absent"}];
const STAT_LBL = Object.fromEntries(STATUTS.map(s=>[s.k,s.l]));
const CARACS = [{k:"vit",l:"Vitesse"},{k:"tech",l:"Technique"},{k:"phy",l:"Physique"},{k:"tac",l:"Tactique"},{k:"men",l:"Mental"}];
const SUM_CATS = [
  {k:"gardien",l:"Gardien",ic:"G"},{k:"defense",l:"Défense",ic:"D"},{k:"milieu",l:"Milieu",ic:"M"},
  {k:"attaque",l:"Attaque",ic:"A"},{k:"global",l:"Global",ic:"★"},{k:"exercice",l:"Exercice à travailler",ic:"!"}
];
// Formation coordinates: x 0-100 (left→right as seen by coach), y 0-100 (attack at top), n = numéro du poste
const F = (arr)=>arr.map(([p,x,y,g,n])=>({p,x,y,g,n}));
const GK = ["GB",50,91,"GB",1];
const D4 = [["DG",13,70,"DEF",3],["DCG",37,75,"DEF",4],["DCD",63,75,"DEF",5],["DD",87,70,"DEF",2]];
const D3 = [["DCG",25,74,"DEF",3],["DC",50,77,"DEF",4],["DCD",75,74,"DEF",5]];
const FORMATIONS = {
  "4-4-2": F([GK,...D4,["MG",13,45,"MIL",11],["MCG",37,50,"MIL",6],["MCD",63,50,"MIL",8],["MD",87,45,"MIL",7],["BUG",37,19,"ATT",10],["BUD",63,19,"ATT",9]]),
  "4-3-3": F([GK,...D4,["MDC",50,57,"MIL",6],["MCG",29,45,"MIL",8],["MCD",71,45,"MIL",10],["AG",16,21,"ATT",11],["BU",50,15,"ATT",9],["AD",84,21,"ATT",7]]),
  "4-2-3-1": F([GK,...D4,["6",37,57,"MIL",6],["8",63,57,"MIL",8],["MOG",15,40,"MIL",11],["10",50,33,"MIL",10],["MOD",85,40,"MIL",7],["BU",50,13,"ATT",9]]),
  "4-1-4-1": F([GK,...D4,["MDC",50,59,"MIL",6],["MG",13,39,"MIL",11],["MCG",37,43,"MIL",8],["MCD",63,43,"MIL",10],["MD",87,39,"MIL",7],["BU",50,15,"ATT",9]]),
  "3-5-2": F([GK,...D3,["PG",10,46,"MIL",11],["MCG",31,49,"MIL",8],["MDC",50,58,"MIL",6],["MCD",69,49,"MIL",10],["PD",90,46,"MIL",2],["BUG",37,19,"ATT",9],["BUD",63,19,"ATT",7]]),
  "3-4-3": F([GK,...D3,["MG",12,47,"MIL",6],["MCG",37,52,"MIL",8],["MCD",63,52,"MIL",10],["MD",88,47,"MIL",2],["AG",16,21,"ATT",11],["BU",50,15,"ATT",9],["AD",84,21,"ATT",7]]),
  "5-3-2": F([GK,["DG",9,62,"DEF",3],["DCG",30,74,"DEF",4],["DC",50,77,"DEF",5],["DCD",70,74,"DEF",6],["DD",91,62,"DEF",2],["MCG",28,46,"MIL",8],["MC",50,50,"MIL",10],["MCD",72,46,"MIL",7],["BUG",37,19,"ATT",9],["BUD",63,19,"ATT",11]]),
  "8 : 3-3-1": F([GK,["DG",22,72,"DEF",3],["DC",50,75,"DEF",4],["DD",78,72,"DEF",2],["MG",20,47,"MIL",11],["MC",50,50,"MIL",6],["MD",80,47,"MIL",7],["BU",50,18,"ATT",9]]),
};
const FKEYS = Object.keys(FORMATIONS);

const S = { players:{}, matches:{} };
const UI = { view:"matches", matchId:null, tab:"prep", pFilter:"ALL", pSearch:"", sel:null, sumTeam:"B" };
let db = null, mode = "connecting";
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];

function newMatch(o={}){
  return {adversaire:"",date:new Date().toISOString().slice(0,10),heure:"15:00",lieu:"dom",competition:"Championnat",
    scoreNous:"",scoreAdv:"",
    teams:{A:{formation:"4-3-3",players:[]},B:{formation:"4-3-3",players:[]},C:{formation:"4-4-2",players:[]}},
    coaching:{formation:"4-3-3",slots:{},causerie:[],capitaine:"",etoiles:{}},
    absents:[], buts:[],
    resume:{joueurs:{},cats:{}}, createdAt:Date.now(), ...o};
}
function normMatch(m){
  const d = newMatch();
  m.teams = m.teams||d.teams; ["A","B","C"].forEach(t=>{m.teams[t]=m.teams[t]||{formation:"4-3-3",players:[]}; m.teams[t].players=m.teams[t].players||[];});
  m.coaching = Object.assign({formation:m.teams.B.formation,slots:{},causerie:[],capitaine:"",etoiles:{}}, m.coaching||{});
  m.resume = Object.assign({joueurs:{},cats:{}}, m.resume||{});
  m.absents = m.absents||[];
  m.buts = m.buts||[];
  return m;
}
const avg = p => { const v=CARACS.map(c=>+(p.stats?.[c.k]||0)).filter(Boolean); return v.length? (v.reduce((a,b)=>a+b,0)/v.length):0; };
const fullName = p => p ? [p.prenom,p.nom].filter(Boolean).join(" ") : "Joueur supprimé";
const shortName = p => !p ? "?" : p.prenom ? p.prenom+(p.nom?" "+p.nom[0]+".":"") : (p.nom||"?");

/* ================= Persistence ================= */
const LS_KEY="fdm-state-v1";
const timers={}, chains={}, dirty=new Set();
let pendingCount=0;
function lsSave(){ try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){} }
function lsLoad(){ try{const v=JSON.parse(localStorage.getItem(LS_KEY)||"null"); if(v){S.players=v.players||{};S.matches=Object.fromEntries(Object.entries(v.matches||{}).map(([k,m])=>[k,normMatch(m)]));}}catch(e){} }
function setSync(){
  const el=$("#sync"); el.className="sync"+(mode==="local"?" local":pendingCount?" saving":"");
  el.lastElementChild.textContent = mode==="connecting"?"Connexion…": mode==="local"?"Enregistré sur cet appareil": pendingCount?"Enregistrement…":"Enregistré";
}
function save(kind,id,delay=500){
  if(mode!=="db"){ lsSave(); return; }
  const key=kind+"/"+id; dirty.add(key);
  clearTimeout(timers[key]);
  if(!timers[key]) {pendingCount++; setSync();}
  timers[key]=setTimeout(()=>{
    timers[key]=null;
    chains[key]=(chains[key]||Promise.resolve()).then(async()=>{
      const obj = (kind==="players"?S.players:S.matches)[id];
      try{
        if(obj) await db.collection(kind).doc(id).set(JSON.parse(JSON.stringify(obj)));
        else await db.collection(kind).doc(id).delete();
      }catch(e){
        if(e?.code==="unavailable"){ await new Promise(r=>setTimeout(r,800+Math.random()*800)); try{ obj? await db.collection(kind).doc(id).set(JSON.parse(JSON.stringify(obj))) : await db.collection(kind).doc(id).delete(); }catch(e2){toast("Enregistrement impossible : "+(e2?.message||"erreur"));} }
        else toast(e?.code==="quota_exceeded"?"Espace de stockage plein : supprimez d'anciens matchs.":"Enregistrement impossible : vous n'avez peut-être pas les droits d'écriture.");
      }
      dirty.delete(key); pendingCount=Math.max(0,pendingCount-1); setSync();
    });
  },delay);
  lsSave();
}
function saveNow(kind,id){ save(kind,id,0); }

let renderQueued=false;
function scheduleRender(){
  const a=document.activeElement;
  if(a && a.matches && a.matches("textarea,input[type=text],input:not([type])") && $("#app").contains(a)){
    if(!renderQueued){renderQueued=true; a.addEventListener("blur",()=>{renderQueued=false;render();},{once:true});}
    return;
  }
  render();
}
function applySnap(kind,snap){
  const store = kind==="players"?S.players:S.matches; let changed=false;
  for(const ch of snap.docChanges()){
    const id=ch.doc.id, key=kind+"/"+id;
    if(dirty.has(key)) continue;
    if(ch.type==="removed"){ if(store[id]){delete store[id];changed=true;} continue; }
    const data=ch.doc.data(); const cur=store[id];
    if(!cur || JSON.stringify(cur)!==JSON.stringify(data)){ store[id]= kind==="matches"? normMatch(structuredClone(data)) : structuredClone(data); changed=true; }
  }
  if(changed){ lsSave(); scheduleRender(); }
}
async function initDb(){
  lsLoad(); render();
  try{
    if(!window.claude?.use) throw 0;
    db = await window.claude.use("db");
  }catch(e){ db=null; }
  if(!db){ mode="local"; setSync(); render(); return; }
  mode="db";
  // Replace local cache with server truth on first snapshot
  let first={players:true,matches:true};
  ["players","matches"].forEach(kind=>{
    db.collection(kind).onSnapshot(snap=>{
      if(first[kind] && !snap.metadata.fromCache){
        first[kind]=false;
        const store={}; snap.docs.forEach(d=>{ const v=structuredClone(d.data()); store[d.id]= kind==="matches"?normMatch(v):v; });
        const old= kind==="players"?S.players:S.matches;
        for(const k of dirty){ const [kk,id]=k.split("/"); if(kk===kind && old[id]) store[id]=old[id]; }
        if(kind==="players") S.players=store; else S.matches=store;
        lsSave(); scheduleRender(); setSync(); return;
      }
      if(first[kind]) return;
      applySnap(kind,snap);
    }, err=>{ toast("Synchronisation interrompue ("+err.code+"). Rechargez la page."); });
  });
  setSync();
}

/* ================= Helpers UI ================= */
function toast(msg){ const r=$("#toast-root"); r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t=setTimeout(()=>r.innerHTML="",2600); }
function statusPill(s){ s=s||"dispo"; return `<span class="pill st-${s}">${STAT_LBL[s]}</span>`; }
function roleBadges(pid){
  const m=UI.view==="match"?cur():null; if(!m) return "";
  let h=m.coaching.capitaine===pid?`<span class="capb" title="Capitaine">C</span>`:"";
  const n=+(Object.keys(m.coaching.etoiles).find(k=>m.coaching.etoiles[k]===pid)||0);
  if(n) h+=`<span class="stars" title="${n} étoile${n>1?"s":""}">${"★".repeat(n)}</span>`;
  return h;
}
function goalStats(list){
  const g={},a={};
  (list||[]).forEach(b=>{ if(b.buteur&&b.buteur!=="csc") g[b.buteur]=(g[b.buteur]||0)+1; if(b.passeur) a[b.passeur]=(a[b.passeur]||0)+1; });
  return {g,a};
}
function seasonStats(){
  const g={},a={},s={};
  Object.values(S.matches).forEach(m=>{
    const st=goalStats(m.buts);
    for(const k in st.g) g[k]=(g[k]||0)+st.g[k];
    for(const k in st.a) a[k]=(a[k]||0)+st.a[k];
    for(const [n,pid] of Object.entries(m.coaching?.etoiles||{})) s[pid]=(s[pid]||0)+(+n);
  });
  return {g,a,s};
}
function statLine(pid,m){
  const st=goalStats(m.buts), g=st.g[pid]||0, a=st.a[pid]||0;
  if(!g&&!a) return "";
  return `<span class="gstat">${[g?`${g} but${g>1?"s":""}`:"",a?`${a} passe${a>1?"s":""} déc.`:""].filter(Boolean).join(" · ")}</span>`;
}
function playerOption(p,sel){ return `<option value="${p.id}" ${p.id===sel?"selected":""}>${esc(p.num?p.num+" · ":"")}${esc(fullName(p))}</option>`; }
function matchPlayerOptions(m,sel){
  return ["B","A","C"].map(t=>{ const ps=sortPlayers(m.teams[t].players.map(id=>S.players[id]).filter(Boolean));
    return ps.length?`<optgroup label="Équipe ${t}">${ps.map(p=>playerOption(p,sel)).join("")}</optgroup>`:""; }).join("");
}
function chip(p,opts={}){
  if(!p) return "";
  const s=p.statut||"dispo";
  return `<div class="chip${UI.sel===p.id?" sel":""}" draggable="true" data-pid="${p.id}" data-src="${opts.src||""}" title="${esc(fullName(p))} · ${POSTE_LBL[p.poste]||""}">
    <span class="num">${esc(opts.num ?? (p.num||"–"))}</span>
    <span class="nm">${esc(shortName(p))}</span>${roleBadges(p.id)}
    <span class="tag">${esc(opts.pos||p.poste||"")}</span>
    <span class="dot st-${s}" title="${STAT_LBL[s]}"></span>
    <button class="iconbtn" data-act="fiche" data-pid="${p.id}" aria-label="Voir la fiche de ${esc(fullName(p))}" style="width:24px;height:24px">${ICON.info}</button>
  </div>`;
}
const ICON = {
  info:`<svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 7v4M8 4.6v.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`,
  x:`<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`,
  up:`<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 10l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`,
  check:`<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  back:`<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>`,
  plus:`<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`,
};
const sortPlayers = arr => arr.sort((a,b)=> POSTES.findIndex(x=>x.k===a.poste)-POSTES.findIndex(x=>x.k===b.poste) || (+a.num||99)-(+b.num||99) || (a.nom||"").localeCompare(b.nom||""));
const MOIS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
function fmtDate(d){ if(!d) return {j:"–",m:""}; const [y,mo,da]=d.split("-"); return {j:+da,m:MOIS[+mo-1]+" "+y.slice(2)}; }
function result(m){ if(m.scoreNous===""||m.scoreAdv===""||m.scoreNous==null||m.scoreAdv==null) return null; const a=+m.scoreNous,b=+m.scoreAdv; return a>b?"w":a<b?"l":"d"; }

/* ================= Render ================= */
function render(){
  $$(".nav button").forEach(b=>b.setAttribute("aria-current", String(b.dataset.nav===(UI.view==="match"?"matches":UI.view))));
  const app=$("#app");
  if(UI.view==="players") app.innerHTML=renderPlayers();
  else if(UI.view==="match" && S.matches[UI.matchId]) app.innerHTML=renderMatch(S.matches[UI.matchId]);
  else { UI.view="matches"; app.innerHTML=renderMatches(); }
  $$("#app .talk textarea").forEach(autoGrow);
  setSync();
}

function renderMatches(){
  const list=Object.entries(S.matches).map(([id,m])=>({id,...m})).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const today=new Date().toISOString().slice(0,10);
  const upcoming=list.filter(m=>m.date>=today).reverse(), past=list.filter(m=>m.date<today);
  const card=m=>{ const d=fmtDate(m.date), r=result(m);
    const nB=(m.teams?.B?.players||[]).length;
    return `<button class="mcard" data-act="open-match" data-mid="${m.id}">
      <div class="mdate"><b>${d.j}</b><span>${d.m}</span></div>
      <div style="min-width:0"><div class="mtitle">vs ${esc(m.adversaire||"Adversaire à définir")}</div>
        <div class="mmeta">${esc(m.competition||"")} · ${m.lieu==="ext"?"Extérieur":"Domicile"} · ${esc(m.heure||"")} · ${nB} joueur${nB>1?"s":""} en équipe B</div></div>
      ${r?`<div class="score res-${r}">${+m.scoreNous} – ${+m.scoreAdv}</div>`:`<div class="score tbd">${m.date>=today?"À venir":"Score ?"}</div>`}
    </button>`; };
  const hasPlayers=Object.keys(S.players).length>0;
  return `<div class="toolbar"><h2>Matchs</h2>
    <button class="btn" data-act="import-link" title="Ouvrir un match reçu par lien">Importer un lien</button>
    <button class="btn primary" data-act="new-match">${ICON.plus} Nouvelle feuille de match</button></div>
    ${!list.length? `<div class="empty"><h3>Aucune feuille de match</h3>
      <p>Créez votre effectif dans l'onglet Effectif, puis une feuille de match pour préparer vos équipes A, B et C.</p>
      <div class="row" style="justify-content:center">
        <button class="btn primary" data-act="new-match">${ICON.plus} Créer une feuille de match</button>
        ${hasPlayers?"":`<button class="btn" data-act="demo">Charger un exemple (18 joueurs + 1 match)</button>`}
      </div></div>`:""}
    ${upcoming.length?`<p class="eyebrow" style="margin:6px 0 8px">À venir</p><div class="mlist">${upcoming.map(card).join("")}</div>`:""}
    ${past.length?`<p class="eyebrow" style="margin:22px 0 8px">Joués</p><div class="mlist">${past.map(card).join("")}</div>`:""}
    ${Object.values(S.players).some(p=>p.demo)?`<p style="margin-top:24px;font-size:13px;color:var(--muted)">Des données d'exemple sont chargées. <button class="btn sm ghost danger" data-act="clear-demo">Supprimer les exemples</button></p>`:""}`;
}

function renderPlayers(){
  const all=Object.values(S.players);
  const SS=seasonStats();
  const seasonLine=p=>{ const g=SS.g[p.id]||0,a=SS.a[p.id]||0,s=SS.s[p.id]||0; if(!g&&!a&&!s) return "";
    return `<div class="row" style="gap:12px;font-size:13px;color:var(--muted)"><span><b style="color:var(--fg)">${g}</b> but${g>1?"s":""}</span><span><b style="color:var(--fg)">${a}</b> passe${a>1?"s":""} déc.</span>${s?`<span><span class="stars">★</span> <b style="color:var(--fg)">${s}</b></span>`:""}</div>`; };
  const q=UI.pSearch.trim().toLowerCase();
  const list=sortPlayers(all.filter(p=>(UI.pFilter==="ALL"||p.poste===UI.pFilter)&&(!q||fullName(p).toLowerCase().includes(q))));
  const counts=Object.fromEntries(POSTES.map(p=>[p.k,all.filter(x=>x.poste===p.k).length]));
  return `<div class="toolbar"><h2>Effectif <span style="color:var(--muted);font-size:22px">${all.length}</span></h2>
    <input class="inp" id="psearch" type="text" placeholder="Rechercher un joueur" value="${esc(UI.pSearch)}" style="max-width:220px">
    <button class="btn primary" data-act="new-player">${ICON.plus} Nouveau joueur</button></div>
    <div class="filters" style="margin-bottom:14px">
      <button class="chipf" data-act="pfilter" data-v="ALL" aria-pressed="${UI.pFilter==="ALL"}">Tous</button>
      ${POSTES.map(p=>`<button class="chipf" data-act="pfilter" data-v="${p.k}" aria-pressed="${UI.pFilter===p.k}">${p.l}s · ${counts[p.k]}</button>`).join("")}
    </div>
    ${!all.length?`<div class="empty"><h3>Votre effectif est vide</h3><p>Ajoutez vos joueurs avec leur poste, leur numéro et leurs caractéristiques. Ils seront ensuite disponibles dans toutes vos feuilles de match.</p>
      <div class="row" style="justify-content:center"><button class="btn primary" data-act="new-player">${ICON.plus} Ajouter un joueur</button><button class="btn" data-act="demo">Charger un exemple</button></div></div>`:""}
    <div class="pgrid">${list.map(p=>`<button class="pcard" data-act="edit-player" data-pid="${p.id}">
      <div class="pcard-top"><span class="jersey">${esc(p.num||"–")}</span>
        <div class="pname">${esc(fullName(p))}<small>${POSTE_LBL[p.poste]||"Poste ?"}${p.postes2?.length?" · "+p.postes2.join(", "):""} · pied ${p.pied==="G"?"gauche":p.pied==="2"?"les deux":"droit"}</small></div></div>
      <div class="row">${statusPill(p.statut)}${p.demo?'<span class="tag">exemple</span>':""}</div>
      ${seasonLine(p)}
      <div class="bars">${CARACS.map(c=>{const v=+(p.stats?.[c.k]||0);return `<span>${c.l}</span><span class="bar"><span style="width:${v*20}%"></span></span><b>${v||"–"}</b>`}).join("")}</div>
    </button>`).join("")}</div>`;
}

function renderMatch(m){
  const r=result(m), id=UI.matchId;
  const nAll=["A","B","C"].reduce((a,t)=>a+m.teams[t].players.length,0);
  return `<div class="row" style="margin-bottom:10px"><button class="btn sm ghost" data-act="back">${ICON.back} Tous les matchs</button><span class="spacer"></span>
      <button class="btn sm" data-act="share-match" title="Créer un lien qui contient uniquement ce match">Envoyer par lien</button>
      <button class="btn sm" data-act="edit-match">Modifier les infos</button></div>
    <div class="sheet-head">
      <div style="min-width:0"><p class="eyebrow">${esc(m.competition||"Match")} · ${m.lieu==="ext"?"Extérieur":"Domicile"}</p>
        <h2>vs ${esc(m.adversaire||"Adversaire à définir")}</h2>

function renderPrep(m){
  const used=new Set([...["A","B","C"].flatMap(t=>m.teams[t].players),...m.absents]);
  const abs=sortPlayers(m.absents.map(id=>S.players[id]).filter(Boolean));
  const absBox=`<section class="team absents dz" data-drop="absent" style="--tc:var(--muted)">
      <div class="team-h"><h3>Absents du week-end</h3><span class="cnt">${abs.length} joueur${abs.length>1?"s":""}</span></div>
      <div class="team-body"><div class="list abs-list">${abs.map(p=>chip(p,{src:"absent"})).join("")}</div>
        ${abs.length?"":`<div class="ph">Glissez ici les joueurs indisponibles ce week-end</div>`}</div>
    </section>`;
  const pool=sortPlayers(Object.values(S.players).filter(p=>!used.has(p.id)));
  const team=t=>{ const T=m.teams[t]; const ps=T.players.map(id=>S.players[id]).filter(Boolean);
    const need=FORMATIONS[T.formation]?.length||11;
    const groups=POSTES.map(g=>({g,ps:sortPlayers(ps.filter(p=>p.poste===g.k))})).filter(x=>x.ps.length);
    return `<section class="team dz" data-t="${t}" data-drop="team:${t}">
      <div class="team-h"><h3>Équipe ${t}</h3><span class="cnt">${ps.length} joueur${ps.length>1?"s":""} · ${need} titulaires</span>
        <select data-act="team-form" data-t="${t}" id="form-${t}" aria-label="Système de l'équipe ${t}">${FKEYS.map(k=>`<option ${k===T.formation?"selected":""}>${k}</option>`).join("")}</select></div>
      <div class="team-body">${groups.length? groups.map(x=>`<div class="grp"><p class="eyebrow">${x.g.l}s · ${x.ps.length}</p><div class="list">${x.ps.map(p=>chip(p,{src:"team:"+t})).join("")}</div></div>`).join("")
        : `<div class="ph">Glissez des joueurs ici${t==="B"?"<br>Ils seront disponibles dans l'onglet Coaching":""}</div>`}</div>
    </section>`; };
  if(!Object.keys(S.players).length) return `<div class="empty"><h3>Aucun joueur dans l'effectif</h3><p>Les compositions se font uniquement avec les joueurs de votre effectif.</p><button class="btn primary" data-act="go-players">Créer mes joueurs</button></div>`;
  return `${isOnline()?`<div class="row" style="justify-content:flex-end;margin-bottom:12px"><button class="btn primary" data-act="export-prep" title="Équipes A, B, C et absents du week-end en PDF">Export PDF</button></div>`:""}
  <div class="prep">
    <aside class="panel pool dz" data-drop="pool">
      <div class="row"><p class="eyebrow">Joueurs disponibles · ${pool.length}</p></div>
      <div class="list">${pool.map(p=>chip(p,{src:"pool"})).join("") || `<p style="color:var(--muted);font-size:13px">Tous les joueurs sont répartis.</p>`}</div>
    </aside>
    <div class="prep-main"><div class="teams">${team("A")}${team("B")}${team("C")}</div>${absBox}</div>
  </div>`;
}

    <path d="M25.5 2 A8.5 8.5 0 0 0 42.5 2"/>

}
function renderCoach(m){
  const C=m.coaching, f=FORMATIONS[C.formation]||FORMATIONS["4-3-3"];
  const bIds=m.teams.B.players.filter(id=>S.players[id]);
  const placed=new Set(Object.values(C.slots).filter(id=>bIds.includes(id)));
  const bench=sortPlayers(bIds.filter(id=>!placed.has(id)).map(id=>S.players[id]));
  const items=C.causerie||[];
  const bOpts=sel=>sortPlayers(bIds.map(id=>S.players[id])).map(p=>playerOption(p,sel)).join("");
  const starters=f.map((s,i)=>({s,i,p:C.slots[i]&&bIds.includes(C.slots[i])?S.players[C.slots[i]]:null})).filter(x=>x.p).sort((a,b)=>a.s.n-b.s.n);
  if(!bIds.length) return `<div class="empty"><h3>L'équipe B est vide</h3><p>Le coaching utilise uniquement les joueurs placés dans l'équipe B, dans l'onglet Préparation.</p><button class="btn primary" data-act="tab" data-v="prep">Aller à la préparation</button></div>`;
  return `<div class="coach">
    <aside class="panel squad dz" data-drop="bench">
      <p class="eyebrow">Titulaires · ${starters.length}/${f.length}</p>
      <div class="list">${starters.map(x=>chip(x.p,{src:"slot:"+x.i,num:x.s.n,pos:x.s.p})).join("")||`<p class="note">Glissez les noms sur les postes du terrain.</p>`}</div>
      <p class="eyebrow" style="margin-top:6px">Remplaçants · ${bench.length}</p>
      <div class="list">${bench.map((p,k)=>chip(p,{src:"bench",num:12+k})).join("")||`<p class="note">Tous les joueurs de l'équipe B sont sur le terrain.</p>`}</div>
    </aside>
    <div class="pitch-wrap">
      <div class="pitch-bar"><p class="eyebrow">Composition · équipe B</p><span class="spacer"></span>
        <label class="row" style="gap:6px;font-size:13px;font-weight:600;color:var(--muted)">Système
        <select data-act="coach-form" id="coach-form" class="inp" style="width:auto;padding:4px 8px">${FKEYS.map(k=>`<option ${k===C.formation?"selected":""}>${k}</option>`).join("")}</select></label>
        <button class="btn sm" data-act="clear-pitch">Vider le terrain</button>
        <button class="btn sm primary" data-act="export-coach" title="Composition et causerie en PDF (A4 paysage)">Export PDF</button></div>
      <div class="pitch">${pitchLines()}
        ${f.map((s,i)=>{ const pid=C.slots[i]; const p=pid&&bIds.includes(pid)?S.players[pid]:null;
          const off = p && p.poste!==s.g;
          return `<div class="slot dz${p?" filled":""}${p&&UI.sel===p.id?" sel":""}" data-drop="slot:${i}" style="left:${s.x}%;top:${s.y}%">
            ${p?`<div class="disc" draggable="true" data-pid="${p.id}" data-src="slot:${i}" title="${esc(fullName(p))}">${s.n}</div><span class="lbl">${esc(shortName(p))}${off?" ⚠":""}</span>${roleBadges(p.id)?`<span class="roles">${roleBadges(p.id)}</span>`:""}`
               :`<div class="disc">${s.p}</div>`}
            ${p?`<span class="pos">${s.p}</span>`:""}
          </div>`; }).join("")}
      </div>
      <p style="font-size:12px;color:var(--muted)">⚠ indique un joueur placé hors de son poste principal. Les numéros suivent les postes ; les remplaçants sont numérotés à partir de 12.</p>
    </div>
    <aside class="panel talk">
      <div><p class="eyebrow">Avant le coup d'envoi</p><h3>Causerie</h3></div>
      <ol>${items.map((it,i)=>`<li class="${it.done?"done":""}">
        <textarea rows="1" data-act="talk-edit" data-i="${i}" id="talk-${it.id}" aria-label="Point ${i+1}">${esc(it.text)}</textarea>
        <span class="acts">
          <button class="iconbtn" data-act="talk-done" data-i="${i}" aria-label="Marquer comme dit" title="Dit">${ICON.check}</button>
          ${i?`<button class="iconbtn" data-act="talk-up" data-i="${i}" aria-label="Monter" title="Monter">${ICON.up}</button>`:`<span style="width:30px"></span>`}
          <button class="iconbtn" data-act="talk-del" data-i="${i}" aria-label="Supprimer" title="Supprimer">${ICON.x}</button>
        </span></li>`).join("")}</ol>
      ${!items.length?`<p class="note">Listez ici les points à dire : consignes collectives, rôles, coups de pied arrêtés, état d'esprit.</p>`:""}
      <form class="add" data-act="talk-add"><input class="inp" id="talk-new" type="text" placeholder="Ajouter un point puis Entrée" autocomplete="off"><button class="btn primary" type="submit">Ajouter</button></form>
      <div class="roles-box">
        <div><p class="eyebrow">Brassard</p><h3>Capitaine</h3></div>
        <select class="inp" data-act="cap" id="cap-sel" aria-label="Capitaine"><option value="">Aucun capitaine</option>${bOpts(C.capitaine)}</select>
        <div><p class="eyebrow">Joueurs du match</p><h3>Étoiles</h3></div>
        ${[3,2,1].map(n=>`<label class="star-row"><span class="stars big" aria-label="${n} étoile${n>1?"s":""}">${"★".repeat(n)}${"☆".repeat(3-n)}</span>
          <select class="inp" data-act="star" data-n="${n}" id="star-${n}"><option value="">—</option>${bOpts(C.etoiles[n])}</select></label>`).join("")}
      </div>
    </aside>
  </div>`;
}

function renderButs(m){
  const B=m.buts, st=goalStats(B);

  return `<section class="panel sum-sec" style="margin-bottom:16px">
    <div class="row"><h3>Buts et passes décisives</h3><span class="tag">${B.length} but${B.length>1?"s":""}</span><span class="spacer"></span>
      <button class="btn sm primary" data-act="but-add">${ICON.plus} Ajouter un but</button></div>
    ${B.length?`<div class="buts">${B.map((b,i)=>`<div class="but-row">
        <span class="but-n">${i+1}</span>
        <label class="fld">Minute<input class="inp" data-act="but-min" data-i="${i}" id="but-min-${b.id}" type="text" inputmode="numeric" value="${esc(b.min||"")}" placeholder="—"></label>
        <label class="fld">Buteur<select class="inp" data-act="but-field" data-f="buteur" data-i="${i}" id="but-b-${b.id}"><option value="">À renseigner</option>${matchPlayerOptions(m,b.buteur)}<option value="csc" ${b.buteur==="csc"?"selected":""}>Contre son camp (adversaire)</option></select></label>
        <label class="fld">Passe décisive<select class="inp" data-act="but-field" data-f="passeur" data-i="${i}" id="but-p-${b.id}"><option value="">Aucune</option>${matchPlayerOptions(m,b.passeur)}</select></label>

}

  const ps=sortPlayers(ids.map(id=>S.players[id]));
  const teamOf=id=>["A","B","C"].find(x=>m.teams[x].players.includes(id));
  return `<div class="row" style="margin-bottom:12px"><p style="margin:0;font-size:13px;color:var(--muted)">L'export final reprend la composition de l'équipe B, les étoiles, les buts, le bilan par zone et les commentaires.</p><span class="spacer"></span>
      <button class="btn primary" data-act="export-final">Export final PDF</button></div>
    ${renderButs(m)}<div class="sum">
    <section class="panel sum-sec">
      <div class="row"><h3>Joueurs</h3><span class="spacer"></span>
        <div class="tsub">${["A","B","C","ALL"].map(x=>`<button class="chipf" data-act="sum-team" data-v="${x}" aria-pressed="${t===x}">${x==="ALL"?"Tous":"Équipe "+x}</button>`).join("")}</div></div>
      ${!ps.length?`<p style="color:var(--muted)">Aucun joueur dans ${t==="ALL"?"ce match":"l'équipe "+t}. Composez les équipes dans l'onglet Préparation.</p>`:""}
      <div>${ps.map(p=>{const j=R.joueurs[p.id]||{}; return `<div class="prow">
        <div class="who">${chip(p,{src:"none"})}
          <div class="rate"><span>Note</span><select data-act="sum-note" data-pid="${p.id}" id="note-${p.id}"><option value="">–</option>${[...Array(11).keys()].map(n=>`<option ${String(j.note)===String(n)?"selected":""}>${n}</option>`).join("")}</select><span>/10</span>${statLine(p.id,m)}${t==="ALL"?`<span class="tag">Éq. ${teamOf(p.id)}</span>`:""}</div></div>
        <textarea data-act="sum-player" data-pid="${p.id}" id="com-${p.id}" placeholder="Commentaire sur le match de ${esc(p.prenom||p.nom||"ce joueur")}">${esc(j.com||"")}</textarea>
      </div>`}).join("")}</div>

      <h3>Bilan par ligne</h3>
      ${SUM_CATS.map(c=>`<div class="cat${c.k==="exercice"?" work":""}"><label for="cat-${c.k}"><span class="ic">${c.ic}</span>${c.l}</label>
        <textarea id="cat-${c.k}" data-act="sum-cat" data-k="${c.k}" placeholder="${c.k==="exercice"?"Exercices à programmer à l'entraînement":"Ce qui a marché, ce qui reste à corriger"}">${esc(R.cats[c.k]||"")}</textarea></div>`).join("")}
    </section>
  </div>`;
}

/* ================= Modals ================= */
function closeModal(){ $("#modal-root").innerHTML=""; }

    if(a==="cancel-del") $("#pconfirm").innerHTML="";
    if(a==="do-del-player"){ deletePlayer(p.id); closeModal(); render(); toast("Joueur supprimé"); }
  });

function deletePlayer(id){
  delete S.players[id]; saveNow("players",id);
  for(const [mid,m] of Object.entries(S.matches)){ let ch=false;
    ["A","B","C"].forEach(t=>{const i=m.teams[t].players.indexOf(id); if(i>=0){m.teams[t].players.splice(i,1);ch=true;}});
    for(const k in m.coaching.slots) if(m.coaching.slots[k]===id){delete m.coaching.slots[k];ch=true;}
    const ai=m.absents.indexOf(id); if(ai>=0){m.absents.splice(ai,1);ch=true;}
    if(m.coaching.capitaine===id){m.coaching.capitaine="";ch=true;}
    for(const k in m.coaching.etoiles) if(m.coaching.etoiles[k]===id){delete m.coaching.etoiles[k];ch=true;}
    m.buts.forEach(b=>{ if(b.buteur===id){b.buteur="";ch=true;} if(b.passeur===id){b.passeur="";ch=true;} });
    if(ch) saveNow("matches",mid);
  }
}

    S.matches[id]=target; saveNow("matches",id); closeModal();

    if(a==="cancel-del") $("#mconfirm").innerHTML="";

  });

/* ================= Moves ================= */
function cur(){ return S.matches[UI.matchId]; }
function moveToTeam(pid,dest){
  const m=cur(); if(!m||!S.players[pid]) return;
  ["A","B","C"].forEach(t=>{const a=m.teams[t].players,i=a.indexOf(pid); if(i>=0)a.splice(i,1);});
  const ai=m.absents.indexOf(pid); if(ai>=0) m.absents.splice(ai,1);
  if(dest==="absent") m.absents.push(pid);
  else if(dest!=="pool") m.teams[dest].players.push(pid);
  if(dest!=="B"){
    for(const k in m.coaching.slots) if(m.coaching.slots[k]===pid) delete m.coaching.slots[k];
    if(m.coaching.capitaine===pid) m.coaching.capitaine="";
    for(const k in m.coaching.etoiles) if(m.coaching.etoiles[k]===pid) delete m.coaching.etoiles[k];
  }
  saveNow("matches",UI.matchId);
}
function moveToSlot(pid,slot){
  const m=cur(); if(!m||!m.teams.B.players.includes(pid)) return;
  const S2=m.coaching.slots; let from=null;
  for(const k in S2) if(S2[k]===pid) from=k;
  const occupant=S2[slot];
  if(from!==null) delete S2[from];
  if(occupant && from!==null && occupant!==pid) S2[from]=occupant;
  S2[slot]=pid;
  saveNow("matches",UI.matchId);
}
function moveToBench(pid){ const m=cur(); for(const k in m.coaching.slots) if(m.coaching.slots[k]===pid) delete m.coaching.slots[k]; saveNow("matches",UI.matchId); }
function drop(pid,target){
  if(!target) return;
  const [kind,val]=target.split(":");
  if(kind==="team") moveToTeam(pid,val);
  else if(kind==="pool") moveToTeam(pid,"pool");
  else if(kind==="absent") moveToTeam(pid,"absent");
  else if(kind==="slot") moveToSlot(pid,val);
  else if(kind==="bench") moveToBench(pid);
  UI.sel=null; render();
}

function lineup(m){
  const C=m.coaching, f=FORMATIONS[C.formation]||FORMATIONS["4-3-3"];
  const bIds=m.teams.B.players.filter(id=>S.players[id]);
  const xi=f.map((s,i)=>{ const pid=C.slots[i]; return {s,p:pid&&bIds.includes(pid)?S.players[pid]:null}; });
  const placed=new Set(xi.filter(x=>x.p).map(x=>x.p.id));
  const subs=sortPlayers(bIds.filter(id=>!placed.has(id)).map(id=>S.players[id])).map((p,k)=>({p,n:12+k}));
  const num={}; xi.forEach(x=>{ if(x.p) num[x.p.id]=x.s.n; }); subs.forEach(x=>num[x.p.id]=x.n);
  return {C,f,xi,subs,num};
}

      <tbody>${all.map(x=>`<tr><td><span>${x.n}</span></td><td class="pr-who"><b>${esc(shortName(x.p))}${m.coaching.capitaine===x.p.id?" (C)":""}</b><div class="pr-badges">${prBadges(m,x.p.id,true)}</div></td><td>${esc((R.joueurs[x.p.id]?.com||"").trim()||"—")}</td></tr>`).join("")
        ||`<tr><td></td><td colspan="2">Aucun joueur dans l'équipe B.</td></tr>`}</tbody></table></div>
    <img class="pr-wm" src="${LOGO()}" alt="">
    <div class="pr-foot"><span>Feuilles de match · ${CLUB}</span><span>Page 2/2</span></div>
  </section>`;
  return page1+page2;
}
let prTitle=null;
function printSheets(html,orient,title){
  $("#print-root").innerHTML=html;
  $("#pr-page").textContent=`@page{size:A4 ${orient};margin:0}`;
  prTitle=document.title; document.title=title;
  toast("Choisissez « Enregistrer au format PDF » et cochez « Imprimer les arrière-plans » si besoin");
  setTimeout(()=>window.print(),60);
}
window.addEventListener("afterprint",()=>{ $("#print-root").innerHTML=""; $("#pr-page").textContent=""; if(prTitle!==null){document.title=prTitle;prTitle=null;} });
function exportName(kind,m){ return `${kind} - vs ${m.adversaire||"adversaire"} - ${m.date||""}`.replace(/[\/\\:*?"<>|]+/g,"-"); }

/* ================= Sauvegarde fichier ================= */
$("#backup-export").onclick=()=>{
  const blob=new Blob([JSON.stringify({app:"feuilles-de-match",version:1,date:new Date().toISOString(),players:S.players,matches:S.matches},null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="feuilles-de-match-"+new Date().toISOString().slice(0,10)+".json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000); toast("Sauvegarde téléchargée");
};
$("#backup-import").onclick=()=>$("#backup-file").click();
$("#backup-file").onchange=e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const v=JSON.parse(r.result); if(!v.players||!v.matches) throw 0;
      if(!confirm("Remplacer les données actuelles par celles de la sauvegarde ?")) return;
      S.players=v.players; S.matches={}; for(const [id,m] of Object.entries(v.matches)) S.matches[id]=normMatch(m);
      UI.view="matches"; UI.sel=null; lsSave(); render(); toast("Sauvegarde restaurée");
    }catch(_){ toast("Fichier de sauvegarde invalide"); }
  };
  r.readAsText(f);
};

/* ================= Partage d'un match par lien ================= */
// Le match voyage après le « # » du lien : cette partie n'est jamais envoyée au serveur qui héberge la page.
const URL_KEY="fdm-online-url";
const isOnline=()=>/^https?:$/.test(location.protocol) && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
function onlineBase(){
  if(isOnline()) return location.origin+location.pathname;
  try{ return localStorage.getItem(URL_KEY)||""; }catch(e){ return ""; }
}
const b64u=bytes=>{ let s=""; for(let i=0;i<bytes.length;i+=0x8000) s+=String.fromCharCode(...bytes.subarray(i,i+0x8000)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); };
const unb64u=str=>{ const s=atob(str.replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from(s,c=>c.charCodeAt(0)); };
async function pipe(bytes,stream){ return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer()); }
async function packMatch(mid){
  const m=S.matches[mid]; if(!m) return "";
  // Tout l'effectif voyage avec le match, pour pouvoir composer avec les joueurs non répartis
  const players={...S.players};
  const bytes=new TextEncoder().encode(JSON.stringify({v:1,mid,match:m,players}));
  if(window.CompressionStream) return "m1="+b64u(await pipe(bytes,new CompressionStream("deflate-raw")));
  return "m0="+b64u(bytes);
}
async function unpackMatch(code){
  const mm=/(?:^|[#&])m([01])=([A-Za-z0-9_-]+)/.exec(code.trim()); if(!mm) throw new Error("format");
  let bytes=unb64u(mm[2]);
  if(mm[1]==="1"){ if(!window.DecompressionStream) throw new Error("navigateur"); bytes=await pipe(bytes,new DecompressionStream("deflate-raw")); }
  const d=JSON.parse(new TextDecoder().decode(bytes));
  if(!d||d.v!==1||!d.mid||!d.match||!d.players) throw new Error("format");
  return d;
}
function importMatchData(d){
  const exists=!!S.matches[d.mid];
  const label=`vs ${d.match.adversaire||"adversaire"} du ${d.match.date||"?"}`;
  if(!confirm(exists?`Le match ${label} existe déjà ici.\nLe remplacer par la version du lien ?`:`Ajouter le match ${label} ?`)) return false;
  for(const [id,p] of Object.entries(d.players)){ S.players[id]=p; saveNow("players",id); }
  S.matches[d.mid]=normMatch(d.match); saveNow("matches",d.mid);
  UI.view="match"; UI.matchId=d.mid; UI.tab="prep"; UI.sel=null; render(); window.scrollTo(0,0);
  toast(exists?"Match mis à jour depuis le lien":"Match importé");
  return true;
}
async function importFromHash(){
  if(!/^#m[01]=/.test(location.hash)) return;
  const code=location.hash;
  history.replaceState(null,"",location.pathname+location.search);
  try{ importMatchData(await unpackMatch(code)); }
  catch(e){ toast(e.message==="navigateur"?"Ce navigateur est trop ancien pour lire ce lien":"Lien de match invalide ou incomplet"); }
}
function openShareModal(mid){
  const m=S.matches[mid]; if(!m) return;
  $("#modal-root").innerHTML=`<div class="modal-bg" data-act="modal-bg"><form class="modal" id="sform" role="dialog" aria-modal="true" aria-labelledby="sm-t">
    <div class="modal-h"><h2 id="sm-t">Envoyer par lien</h2><button type="button" class="iconbtn" data-act="close">${ICON.x}</button></div>
    <div class="modal-b">
      <p style="margin:0">Ce lien contient <b>uniquement le match vs ${esc(m.adversaire||"adversaire")}</b> et ton effectif (${Object.keys(S.players).length} joueurs), y compris ceux qui ne sont dans aucune équipe. Les autres matchs ne sont pas inclus. Ouvert sur un autre appareil, il y crée une copie que tu peux modifier en local.</p>
      ${isOnline()?"":`<label class="fld">Adresse de ton application en ligne<input id="s-url" type="url" placeholder="https://ton-compte.github.io/feuilles-de-match/" value="${esc(onlineBase())}"></label>`}
      <label class="fld">Lien du match<textarea id="s-link" readonly rows="4" style="font-size:12px;word-break:break-all" placeholder="${isOnline()?"":"Renseigne d'abord l'adresse de l'application en ligne"}"></textarea></label>
      <p style="margin:0;font-size:13px;color:var(--muted)">⚠ Toute personne qui reçoit ce lien peut voir le match : envoie-le uniquement à toi-même (AirDrop, note, message à toi-même).</p>
    </div>
    <div class="modal-f"><span class="spacer"></span>
      ${navigator.share?`<button type="button" class="btn" data-act="s-share">Partager…</button>`:""}
      <button type="button" class="btn primary" data-act="s-copy">Copier le lien</button></div>
  </form></div>`;
  const form=$("#sform"), out=$("#s-link");
  const build=async()=>{
    let base=onlineBase().trim();
    if(base && !/^https:\/\//.test(base)){ out.value=""; out.placeholder="L'adresse doit commencer par https://"; return ""; }
    if(!base){ out.value=""; return ""; }
    out.value=base.replace(/#.*$/,"")+"#"+await packMatch(mid); return out.value;
  };
  $("#s-url")?.addEventListener("input",e=>{ try{localStorage.setItem(URL_KEY,e.target.value.trim());}catch(_){} build(); });
  form.onsubmit=e=>e.preventDefault();
  form.addEventListener("click",async e=>{
    const a=e.target.closest("[data-act]")?.dataset.act;
    if(a!=="s-copy"&&a!=="s-share") return;
    const link=await build(); if(!link){ toast("Renseigne l'adresse de l'application en ligne"); $("#s-url")?.focus(); return; }
    if(a==="s-copy"){ try{ await navigator.clipboard.writeText(link); toast("Lien copié"); }catch(_){ out.select(); document.execCommand("copy"); toast("Lien copié"); } }
    else{ try{ await navigator.share({title:"Match vs "+(m.adversaire||""),url:link}); }catch(_){} }
  });
  build();
}
function openImportModal(){
  $("#modal-root").innerHTML=`<div class="modal-bg" data-act="modal-bg"><form class="modal" id="iform" role="dialog" aria-modal="true" aria-labelledby="im-t">
    <div class="modal-h"><h2 id="im-t">Importer un lien</h2><button type="button" class="iconbtn" data-act="close">${ICON.x}</button></div>
    <div class="modal-b">
      <p style="margin:0">Colle ici le lien d'un match reçu depuis un autre appareil. Le match et l'effectif seront ajoutés, ou mis à jour s'ils existent déjà.</p>
      <label class="fld">Lien du match<textarea id="i-link" rows="4" style="font-size:12px;word-break:break-all" placeholder="https://…#m1=…"></textarea></label>
    </div>
    <div class="modal-f"><span class="spacer"></span><button type="button" class="btn" data-act="close">Annuler</button><button class="btn primary" type="submit">Importer</button></div>
  </form></div>`;
  $("#iform").onsubmit=async e=>{ e.preventDefault();
    try{ const d=await unpackMatch($("#i-link").value); closeModal(); importMatchData(d); }
    catch(err){ toast(err.message==="navigateur"?"Ce navigateur est trop ancien pour lire ce lien":"Lien de match invalide ou incomplet"); }
  };
  setTimeout(()=>$("#i-link")?.focus(),30);
}
window.addEventListener("hashchange",importFromHash);
if(isOnline() && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});

initDb();
importFromHash();
})();
</script>
